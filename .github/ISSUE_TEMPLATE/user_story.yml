name: "CYD WARSHIP — User Story / mission"
description: "Contrat de réalisation remis à un agent. Le Pilotage prépare et attribue l'Issue."
title: ""
body:
  - type: markdown
    attributes:
      value: |
        **I-009 — CYD WARSHIP.** Une Issue est le contrat de mission partagé entre agents.
        Ne pas démarrer un travail technique ou graphique sans mandat du Pilotage.
        Le backlog est géré dans les Issues du dépôt, sans GitHub Projects obligatoire.
        Pilotage tient à jour le statut, le type, le responsable, la priorité et le lot dans le corps de l'Issue ; les changements significatifs sont datés en commentaire.
        Préfixer le titre avec [US-DEV], [US-GRAPH], [DOC-PO], [SPIKE], [BUG] ou [TECH].
        BIBLE_PRODUIT.md est l'unique référence métier : toute US cite les décisions applicables (§ et IDs), sans les recopier.
        Maquettes, ADR, Issues antérieures et échanges sont complémentaires et ne peuvent créer de règles produit.
        Nouvelle décision PO non intégrée à la Bible = US dépendante non « Prête ».
        Rester concis, autonome et testable ; inscrire « Non applicable » avec justification lorsqu'un champ est sans objet.
  - type: dropdown
    id: type
    attributes:
      label: "Type de mission"
      options:
        - "US-DEV"
        - "US-GRAPH"
        - "DOC-PO"
        - "SPIKE"
        - "BUG"
        - "TECH"
    validations:
      required: true
  - type: dropdown
    id: statut
    attributes:
      label: "Statut Pilotage"
      description: "À la création, laisser À qualifier. Seul Pilotage déclare Prête, En revue ou Terminée."
      options:
        - "À qualifier"
        - "Prête"
        - "En cours"
        - "En revue"
        - "Bloquée"
        - "Terminée"
    validations:
      required: true
  - type: dropdown
    id: priorite
    attributes:
      label: "Priorité"
      options:
        - "À déterminer"
        - "P0 — Bloquant critique"
        - "P1 — Haute"
        - "P2 — Normale"
        - "P3 — Basse"
    validations:
      required: true
  - type: dropdown
    id: lot
    attributes:
      label: "Lot"
      options:
        - "À préciser"
        - "LOT 1"
        - "V1.0 futur"
        - "Hors lot"
    validations:
      required: true
  - type: dropdown
    id: responsable
    attributes:
      label: "Agent responsable principal"
      options:
        - "À attribuer par Pilotage"
        - "Développeur C / ESP32 CYD"
        - "Graphiste / Directeur artistique"
        - "Assistant PO (documentaire)"
        - "Pilotage (investigation / coordination)"
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: "Source du besoin et contexte"
      description: "Citer les décisions applicables de BIBLE_PRODUIT.md (§ et IDs). Les autres liens sont complémentaires, non normatifs. Si aucune règle métier ne s’applique (mission purement technique), indiquer « Non applicable » et pourquoi."
      placeholder: "Bible §14.2 — LOT1-PL-001, LOT1-FLT-001 ; compléments utiles, uniquement si nécessaires."
    validations:
      required: true
  - type: textarea
    id: valeur
    attributes:
      label: "Objectif / valeur"
      placeholder: "En tant que ..., je veux ..., afin de ... ; ou objectif explicite d'investigation."
    validations:
      required: true
  - type: textarea
    id: perimetre
    attributes:
      label: "Inclus / exclus"
      description: "Portée bornée, sans recopier les exigences de la Bible. Pour un point sans objet : « Non applicable » (justifier)."
      value: |
        **Inclus :**

        **Exclus :**
    validations:
      required: true
  - type: textarea
    id: dependances
    attributes:
      label: "Dépendances / contrats"
      description: "Uniquement les liens et interfaces nécessaires. Indiquer « Non applicable » et justifier si aucune dépendance."
      placeholder: "Bloquée par #..., dépend de l'interface ..., ou AUCUNE."
    validations:
      required: true
  - type: textarea
    id: acceptation
    attributes:
      label: "Critères d'acceptation vérifiables"
      description: "Quelques critères autonomes, observables et testables, dérivés de la Bible ; aucun ajout de règle métier."
      value: |
        - [ ] Critère observable 1
        - [ ] Critère observable 2
    validations:
      required: true
  - type: textarea
    id: preuves
    attributes:
      label: "Preuves de livraison exigées"
      description: "Niveaux de preuve requis pour cette mission : PC, build ESP32, CI, CYD physique, ou revue de maquette. Non applicable si justifié."
      value: |
        - [ ] PR liée, HEAD exact, diff et limites
        - [ ] Tests / revues requis pour cette mission (préciser)
        - [ ] Vérification matérielle : REQUISE / DIFFÉRÉE / NON APPLICABLE (justifier)
    validations:
      required: true
  - type: textarea
    id: risques
    attributes:
      label: "Risques, inconnues et arbitrage PO"
      description: "Si une incertitude bloque le découpage, proposer un SPIKE plutôt que d'inventer la règle."
      placeholder: "Aucun, ou éléments à vérifier / décision PO nécessaire."
    validations:
      required: false
