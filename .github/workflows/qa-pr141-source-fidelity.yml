name: "Pilotage QA PR141 original source / candidate integrity"
on:
  push:
    branches:
      - pilotage/qa-pr141-source-fidelity-20261116
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: python -m pip install 'Pillow==12.0.0'
      - name: Original PO vs candidate facts (no file modification)
        shell: bash
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import hashlib
          for k in ('on','off'):
              p=Path('draft/Bouton_Attaquer_'+k+'.png')
              data=p.read_bytes()
              blob=hashlib.sha1(('blob '+str(len(data))+'\0').encode()+data).hexdigest()
              with Image.open(p) as im:
                  rgba=im.convert('RGBA')
                  al=rgba.getchannel('A')
                  print('ORIGINAL',k,'dimensions',im.size,'mode',im.mode,'bytes',len(data),'sha256',hashlib.sha256(data).hexdigest(),'git_blob',blob,'alpha',al.getextrema(),'alpha_bbox',al.getbbox(),'corners',[rgba.getpixel(x)[3] for x in ((0,0),(im.width-1,0),(0,im.height-1),(im.width-1,im.height-1))])
          PY
          python draft/etudes/bouton_attaquer/qa.py
          python scripts/check_graphic_pipeline.py
