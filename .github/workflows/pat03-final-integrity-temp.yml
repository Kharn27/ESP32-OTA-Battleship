name: PAT-03 T2A final verification (temporary)
on:
  push:
    branches:
      - design/issue-81-patrouilleur-degats-avant
permissions:
  contents: read
jobs:
  verify-pat03:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned Pillow
        run: python -m pip install Pillow==12.3.0
      - name: Verify final T2A sources, PAT01/PAT02, RGB, LANCZOS, x4 NEAREST and manifest
        run: python design/patrouilleur/export_pat03_avant.py --check
      - name: Verify no changes in check-only mode
        run: git diff --exit-code && test -z "$(git status --porcelain)"
