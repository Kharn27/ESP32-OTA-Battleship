name: G04-R2 artwork import temporary
on:
  push:
    branches:
      - design/g04-r2-attaque
    paths:
      - .github/workflows/g04-r2-publish.yml
permissions:
  contents: write
jobs:
  import-design:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/g04-r2-attaque
          persist-credentials: true
      - name: Import supplied original artwork and native exports
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --max-time 90 'https://at.adobe.com/JCT5ItwhGDoWW7HW' --output /tmp/g04-r2-publish.zip
          python3 - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          z=ZipFile('/tmp/g04-r2-publish.zip')
          allowed='design/ecrans/attaque/'
          members=z.namelist()
          assert len(members)==8, members
          assert all(m.startswith(allowed) and '..' not in Path(m).parts for m in members)
          z.extractall('.')
          print('Extracted',len(members),'artwork/source/proof files')
          PY
          python3 -m pip install --quiet Pillow
          python3 design/ecrans/attaque/build_g04_r2.py
          python3 design/ecrans/attaque/verify_g04_r2.py | tee design/ecrans/attaque/verification-PC.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add design/ecrans/attaque/
          if ! git diff --cached --quiet; then
            git commit -m "design(g04-r2): publish maritime illustrated 320x240 artwork Refs #45"
            git push origin HEAD:design/g04-r2-attaque
          fi
