name: QA isolated BTN-FMT-01 production
on:
  push:
    branches:
      - design/issue-163-boutons-format-uniforme
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    if: startsWith(github.event.head_commit.message, 'qa(163):')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact graphic toolchain
        run: python -m pip install -r draft/etudes/boutons_format_uniforme/requirements.txt
      - name: Generate from the nine authenticated Git sources
        run: python draft/etudes/boutons_format_uniforme/generate.py --repo .
      - name: Verify all outputs byte-for-byte and native sizes
        run: python draft/etudes/boutons_format_uniforme/generate.py --repo . --check
      - name: Validate graphic catalog invariants
        run: python scripts/check_graphic_pipeline.py
      - uses: actions/upload-artifact@v4
        with:
          name: btn-fmt-01-family-candidates
          retention-days: 3
          if-no-files-found: error
          path: |
            draft/etudes/boutons_format_uniforme/exports/
            draft/etudes/boutons_format_uniforme/maitres/
            draft/etudes/boutons_format_uniforme/preuves/
            draft/etudes/boutons_format_uniforme/rapport.json
      - name: Commit generated binary assets to study branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add draft/etudes/boutons_format_uniforme/
          if ! git diff --cached --quiet; then
            git commit -m "design(163): export reproducible 140x35 family and native proofs"
            git push origin HEAD:design/issue-163-boutons-format-uniforme
          fi
