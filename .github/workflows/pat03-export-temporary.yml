name: PAT-03 compare exports (temporary)
on:
  push:
    branches:
      - design/issue-81-patrouilleur-degats-avant
permissions:
  contents: write
jobs:
  export-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow pinned for reproducibility
        run: python -m pip install Pillow==12.3.0
      - name: Generate source-faithful preview files
        run: python design/patrouilleur/export_pat03_comparatif.py
      - name: Validate SHA, format, pixel equality and manifest
        run: python design/patrouilleur/export_pat03_comparatif.py --check
      - name: Commit only phase-one previews and proof
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add design/patrouilleur/revue_pat03/
          git diff --cached --name-only
          git diff --cached --quiet || git commit -m "design(PAT-03): apercus natifs T2A et T2B avec preuves (#81)"
          git push
