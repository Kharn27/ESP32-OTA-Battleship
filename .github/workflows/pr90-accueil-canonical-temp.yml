name: PR90 accueil canonical reproducibility (temporary)
on:
  push:
    branches:
      - assets/accueil-alpha-png
    paths:
      - .github/workflows/pr90-accueil-canonical-temp.yml
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install fixed Pillow
        run: python -m pip install Pillow==12.3.0
      - name: Verify canonical assets and reproducibility
        shell: bash
        run: |
          set -euo pipefail
          test ! -e draft/accueil/Bouton_jouer_RGBA.png
          test ! -e draft/accueil/composition/accueil_320x240.png
          test -f draft/Wallpaper_accueil.jpeg
          test -f draft/Logo_titre.jpeg
          test -f draft/Bouton_jouer.jpeg
          test -f draft/Bouton_palmares.jpeg
          test ! -e design/ecrans/accueil/accueil_cyd_warship.svg
          python design/ecrans/accueil/compose_accueil.py --repo . --out design/ecrans/accueil --check
          git diff --exit-code
          test -z "$(git status --porcelain)"
          echo 'PASS: accueil relocated to design/ecrans/accueil, source originals preserved, --check byte exact'
