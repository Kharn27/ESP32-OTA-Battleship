name: PR90 accueil canonical regeneration (temporary)
on:
  push:
    branches:
      - assets/accueil-alpha-png
    paths:
      - .github/workflows/pr90-accueil-canonical-temp.yml
permissions:
  contents: write
jobs:
  regenerate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install fixed Pillow
        run: python -m pip install Pillow==12.3.0
      - name: Rebuild canonical editable ORA and reproducible manifest
        shell: bash
        run: |
          set -euo pipefail
          test ! -e draft/accueil/Bouton_jouer_RGBA.png
          test ! -e draft/accueil/composition/accueil_320x240.png
          test ! -e design/ecrans/accueil/accueil_cyd_warship.svg
          folder="$(mktemp -d)"
          python design/ecrans/accueil/compose_accueil.py --repo . --out "$folder"
          for f in \
            accueil_cyd_warship_320x240.png accueil_cyd_warship_x4.png \
            sprites/logo_titre_145x66.png sprites/bouton_jouer_140x32.png \
            sprites/bouton_palmares_140x30.png \
            preuves/alpha_clair_sombre_640x720.png \
            preuves/zones_tactiles_320x240.png; do
            cmp "$folder/$f" "design/ecrans/accueil/$f"
          done
          cp "$folder/accueil_cyd_warship_4_calques.ora" design/ecrans/accueil/
          cp "$folder/manifest.json" design/ecrans/accueil/
          python design/ecrans/accueil/compose_accueil.py --repo . --out design/ecrans/accueil --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add design/ecrans/accueil/accueil_cyd_warship_4_calques.ora design/ecrans/accueil/manifest.json
          git diff --cached --quiet || git commit -m 'fix(accueil): re-export canonical ORA and matching reproducible manifest'
          git push origin HEAD:assets/accueil-alpha-png
          echo 'PASS: canonical PNGs identical, canonical ORA+manifest regenerated and committed'
