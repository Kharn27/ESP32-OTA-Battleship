name: G03 temporary export previews
on:
  push:
    branches:
      - design/issue-37-deploiement
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install 'CairoSVG==2.7.1' 'Pillow==11.3.0'
      - run: python design/issue-37-deploiement/export_previews.py
      - name: Store deterministic SVG export PNGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add design/issue-37-deploiement/g03_deploiement_320x240.png design/issue-37-deploiement/g03_deploiement_x4.png
          if ! git diff --cached --quiet; then
            git commit -m "design(G03): export PNG 320x240 et nearest x4"
            git push origin HEAD:design/issue-37-deploiement
          fi
