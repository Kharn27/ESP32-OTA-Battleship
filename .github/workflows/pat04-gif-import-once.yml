name: PAT-04 PO PNG+GIF final integrity (temporary)
on:
  push:
    branches:
      - design/issue-82-patrouilleur-detruit-fusion-po
    paths:
      - .github/workflows/pat04-gif-import-once.yml
permissions:
  contents: read
jobs:
  verify-sources-and-exports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify preserved PNG master and replacement GIF
        shell: bash
        run: |
          set -euo pipefail
          test ! -e draft/patrouilleur_B.jpeg
          printf '%s  %s\n' 'e004d3b1274133f118ab407e7854d2050121654cca0881b513c7acbc3bd1a808' 'draft/patrouilleur_B_PO_fusion.png' | sha256sum --check --strict
          printf '%s  %s\n' '64391042c66bb89cce8f04622a213d85fd028ea6bdbefbf59cd60ed611c4f096' 'draft/patrouilleur_detruit.gif' | sha256sum --check --strict
          python -m pip install Pillow==12.3.0
          python - <<'PY'
          from PIL import Image
          with Image.open('draft/patrouilleur_detruit.gif') as im:
              assert im.format=='GIF' and im.size==(478,356) and im.n_frames==9
              ds=[]
              for i in range(im.n_frames):
                  im.seek(i)
                  ds.append(im.info.get('duration'))
              assert ds==[160]*9,ds
          print('PASS GIF: 9 frames x 160ms')
          PY
      - name: PAT-04 reproducibility check with only master PNG
        shell: bash
        run: |
          set -euo pipefail
          python design/patrouilleur/export_pat04_detruit.py --check
          git diff --exit-code
          test -z "$(git status --porcelain)"
          echo 'PASS PAT-04 --check, worktree clean; PNG master and GIF source verified'
