name: G04 temporary visual export
on:
  push:
    branches: [design/issue-45-attaque]
permissions:
  contents: write
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned graphic tools
        run: python -m pip install 'CairoSVG==2.7.1' 'Pillow==11.3.0'
      - name: Verify actual SVG and build previews
        run: python design/issue-45-attaque/export_previews.py
      - name: Version preview PNGs in the design branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add design/issue-45-attaque/g04_attaque_320x240.png design/issue-45-attaque/g04_attaque_x4.png design/issue-45-attaque/g04_etats_annexes.png
          if ! git diff --cached --quiet; then
            git commit -m 'design(G04): export natif et variantes PNG'
            git push origin HEAD:design/issue-45-attaque
          fi
