name: PAT-02 phase-1 compare T1A and T1B sources
on:
  push:
    branches: [design/issue-80-patrouilleur-degats-arriere]
    paths:
      - .github/workflows/pat-02-compare.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  compare-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PAT-02 branch
        uses: actions/checkout@v4
        with:
          ref: design/issue-80-patrouilleur-degats-arriere
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned Pillow (as PAT-01)
        run: python -m pip install Pillow==12.3.0
      - name: Export candidate A and B, same full-frame geometry as PAT-01
        run: python design/patrouilleur/export_pat02_comparatif.py
      - name: Verify candidate A and B dimensions, sources, and pixel-exact x4
        run: python design/patrouilleur/export_pat02_comparatif.py --check
      - name: Commit 4 previews and manifest, remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- design/patrouilleur/revue_pat02/patrouilleur_T1A_320x240.png design/patrouilleur/revue_pat02/patrouilleur_T1A_x4.png design/patrouilleur/revue_pat02/patrouilleur_T1B_320x240.png design/patrouilleur/revue_pat02/patrouilleur_T1B_x4.png design/patrouilleur/revue_pat02/preuves/export_manifest.json
          git rm -- .github/workflows/pat-02-compare.yml
          git diff --cached --name-only
          test "$(git diff --cached --name-only | wc -l)" -eq 6
          git commit -m "design(PAT-02): comparison previews and verified source hashes for PO decision (#80)"
          git push origin HEAD:design/issue-80-patrouilleur-degats-arriere
