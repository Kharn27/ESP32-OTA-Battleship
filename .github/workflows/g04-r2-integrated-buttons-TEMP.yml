name: G04-R2 integrated buttons PC import (TEMPORARY)
on:
  push:
    branches:
      - design/g04-r2-attaque
    paths:
      - .github/workflows/g04-r2-integrated-buttons-TEMP.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/g04-r2-attaque
          persist-credentials: true
      - name: Verify published ZIP, regenerate and independently receive art
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --max-time 120 -o /tmp/g04r2_button_fix.zip 'https://at.adobe.com/eRtk0CWxkirbY5Pu'
          echo 'b4343a7f6071702df3f33519b10877dc9c00751981e412b38b2ead6d2be626ab  /tmp/g04r2_button_fix.zip' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import PurePosixPath
          from zipfile import ZipFile
          with ZipFile('/tmp/g04r2_button_fix.zip') as z:
              files=[f for f in z.namelist() if not f.endswith('/')]
              assert len(files)==19,(len(files),files)
              assert len(files)==len(set(files))
              assert all(f.startswith('design/ecrans/attaque/') and '..' not in PurePosixPath(f).parts for f in files)
              z.extractall('.')
              print('ZIP scoped to G04-R2: 19 assets, source and PC evidence')
          PY
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-dejavu-core
          python3 -m pip install --disable-pip-version-check --quiet 'Pillow==12.3.0'
          python3 design/ecrans/attaque/build_g04_r2.py > /tmp/g04r2_build.log
          python3 design/ecrans/attaque/verify_g04_r2.py | tee design/ecrans/attaque/verification-PC.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add design/ecrans/attaque
          git diff --cached --stat
          if ! git diff --cached --quiet; then
              git commit -m 'design(g04-r2): integrate sculpted nautical controls 320x240 (Refs #45)'
              git push origin HEAD:design/g04-r2-attaque
          fi
