name: BTN-TYPO-01 temporary production #157
on:
  push:
    branches:
      - design/issue-157-boutons-typographie
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned graphics dependencies
        run: python -m pip install Pillow==12.3.0 numpy==2.2.6 opencv-python-headless==4.12.0.88
      - name: Restore human-readable source
        run: python draft/etudes/boutons_typographie/bootstrap.py
      - name: Protect isolated HD lettering margins
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('draft/etudes/boutons_typographie/generate.py')
          s=p.read_text()
          s=s.replace('roi=(408,52,832,198)','roi=(390,35,865,214)')
          s=s.replace('roi=(384,39,990,197)','roi=(356,23,1022,211)')
          s=s.replace("raise RuntimeError('Mask touches ROI edge')",
                      "raise RuntimeError('Mask touches ROI edge in '+spec['hd']+' border='+str([int(hard[0].max()),int(hard[-1].max()),int(hard[:,0].max()),int(hard[:,-1].max())]))")
          p.write_text(s)
          PY
      - name: Generate four variants and proofs from real approved images
        run: python draft/etudes/boutons_typographie/generate.py --repo .
      - name: Reproducibility check (no writes)
        run: python draft/etudes/boutons_typographie/generate.py --repo . --check
      - name: Graphic pipeline
        run: python scripts/check_graphic_pipeline.py
      - name: Commit study; remove temporary workflow/bootstrap
        run: |
          rm -f draft/etudes/boutons_typographie/bootstrap.py .github/workflows/qa-btn-typo-157.yml
          git add -A draft/etudes/boutons_typographie .github/workflows/qa-btn-typo-157.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(graphics): four HD typography candidates, native proofs and SHA audit #157"
          git push origin HEAD:design/issue-157-boutons-typographie
