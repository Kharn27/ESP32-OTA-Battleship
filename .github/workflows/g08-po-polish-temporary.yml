name: G08 PO artwork — polish proof
on:
  push:
    branches: [design/issue-55-g08-inspection]
    paths: [.github/workflows/g08-po-polish-temporary.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and validate revised G08 artwork
        env:
          ART_URL: https://at.adobe.com/fPCyhbS0IUZDVO4H
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 --max-time 150 "$ART_URL" -o /tmp/g08-po.zip
          unzip -t /tmp/g08-po.zip
          unzip -o /tmp/g08-po.zip -d .
          python3 -m pip install --user pillow
          python3 design/issue-55-g08-inspection/build_g08_reference.py
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import json,zipfile
          d=Path('design/issue-55-g08-inspection')
          j=json.loads((d/'scenario_G08.json').read_text())
          assert sorted(map(len,j['fleet'].values()))==[2,3,3,4,5]
          assert len(j['hits'])==12 and len(j['untouched'])==5
          assert set(j['hits']).isdisjoint(j['misses'])
          for s in 'abc':
              im=Image.open(d/f'g08_etat_{s}_320x240.png')
              up=Image.open(d/f'g08_etat_{s}_x4.png')
              assert im.size==(320,240) and up.size==(1280,960)
              assert im.resize(up.size,Image.Resampling.NEAREST).tobytes()==up.tobytes()
              with zipfile.ZipFile(d/f'g08_etat_{s}_layers.ora') as z:
                  assert z.testzip() is None and 'stack.xml' in z.namelist()
          print('PASS G08 PO polish — 3 native + x4 + editable ORA, 5 ships, impacts fixed')
          PY
      - name: Commit corrected art
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A design/issue-55-g08-inspection
          if ! git diff --cached --quiet; then
            git commit -m "design(G08): polish native maritime UI panels and footer (Refs #55)"
            git push
          fi
