name: Seed issue 105 wallpapers (temporary)
on:
  push:
    branches:
      - 'assets/issue-105-wallpapers'
permissions:
  contents: write
jobs:
  seed:
    if: contains(github.event.head_commit.message, '[wallpaper-seed]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with complete Git history
        uses: actions/checkout@v4
        with:
          ref: 'assets/issue-105-wallpapers'
          fetch-depth: 0
      - name: Generate deterministic 4-image catalog
        run: |
          python3 -m venv /tmp/wallpaper-venv
          /tmp/wallpaper-venv/bin/python -m pip install --disable-pip-version-check "Pillow==12.3.0"
          /tmp/wallpaper-venv/bin/python scripts/export_wallpapers.py --write
      - name: Commit generated binary outputs on topic branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/wallpaper assets/manifest.json
          git diff --cached --quiet && exit 0
          git commit -m 'assets(wallpaper): generate four original/CYD images'
          git push origin HEAD:assets/issue-105-wallpapers
