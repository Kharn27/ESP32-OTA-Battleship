name: PR90 Accueil - PNG 320x240 et sources (temporaire)

on:
  push:
    branches:
      - assets/accueil-alpha-png
    paths:
      - .github/workflows/accueil-pr90-export-temp.yml
      - draft/accueil/compose_accueil.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compose:
    name: Production et publication des vrais PNG accueil
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/assets/accueil-alpha-png'
    steps:
      - name: Checkout de la branche PR
        uses: actions/checkout@v4
        with:
          ref: assets/accueil-alpha-png
          persist-credentials: true

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Dépendance export figée
        run: python -m pip install 'Pillow==12.3.0'

      - name: Générer, rouvrir et contrôler les vrais fichiers
        run: |
          python draft/accueil/compose_accueil.py \
            --repo . \
            --out draft/accueil/composition
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          out=Path("draft/accueil/composition")
          m=json.loads((out/"manifest.json").read_text(encoding="utf8"))
          expected={
             "accueil_320x240.png":((320,240),"RGB"),
             "accueil_x4_NEAREST.png":((1280,960),"RGB"),
             "sprites/logo_titre_145x66.png":((145,66),"RGBA"),
             "sprites/bouton_jouer_140x32.png":((140,32),"RGBA"),
             "sprites/bouton_palmares_140x30.png":((140,30),"RGBA"),
             "preuves/alpha_clair_sombre_640x720.png":((640,720),"RGB"),
             "preuves/zones_tactiles_320x240.png":((320,240),"RGB"),
          }
          for rel,(dims,mode) in expected.items():
              with Image.open(out/rel) as im:
                  assert im.format=="PNG" and im.size==dims and im.mode==mode, (rel,im.size,im.mode)
          assert len(m["exports"])==len(expected)+1, m["exports"].keys()
          assert (out/"edition/accueil_4_calques.ora").exists()
          print("PASS 7 vrais PNG + ORA + manifeste; dimensions, modes, transparence et zoom vérifiés")
          PY

      - name: Conserver une preuve Actions téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: accueil-PR90-320x240
          path: draft/accueil/composition/
          if-no-files-found: error
          retention-days: 30

      - name: Publier les binaires directement dans la branche de la PR
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add draft/accueil/composition/
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Exports deja identiques, aucun nouveau commit"
          else
            git commit -m 'design(accueil): publier PNG natif, zoom x4, sprites, ORA et preuves PR #90'
            git push origin HEAD:refs/heads/assets/accueil-alpha-png
          fi
