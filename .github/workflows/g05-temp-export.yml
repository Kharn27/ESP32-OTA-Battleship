name: G05 temporary previews & PC checks
on:
  push:
    branches:
      - design/issue-46-defense
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'CairoSVG==2.7.1' 'Pillow==12.3.0'
      - run: python design/issue-46-defense/export_previews.py
      - name: Commit native and 4x PNG previews
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add design/issue-46-defense/g05_defense_320x240.png design/issue-46-defense/g05_defense_x4.png
          if ! git diff --cached --quiet; then
            git commit -m 'design(G05): exports natif et NEAREST x4'
            git push origin HEAD:design/issue-46-defense
          fi
