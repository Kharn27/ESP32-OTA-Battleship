name: G06 temporary graphic preview export
on:
  push:
    branches:
      - design/issue-47-palmares
permissions:
  contents: write
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'CairoSVG==2.7.1' 'Pillow==12.3.0'
      - name: Test and export editable previews
        run: python design/issue-47-palmares/export_previews.py
      - name: Commit PNG preview artifacts to design branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add design/issue-47-palmares/g06_palmares_320x240.png design/issue-47-palmares/g06_palmares_x4.png design/issue-47-palmares/g06_zero_partie.png
          if ! git diff --cached --quiet; then
            git commit -m 'design(G06): exporter palmares natif, zoom NEAREST et variante zéro'
            git push origin HEAD:design/issue-47-palmares
          fi
