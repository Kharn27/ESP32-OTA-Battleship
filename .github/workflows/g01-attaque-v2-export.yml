name: G01 ATTAQUE artistic preview V2 exports
on:
  push:
    branches:
      - design/issue-16-direction-lot1
    paths:
      - '.github/workflows/g01-attaque-v2-export.yml'
      - 'design/issue-16-direction-lot1/attaque_g01_v2.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install artwork rendering dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-dejavu-core
          python -m pip install 'Pillow==12.1.0'
      - name: Render exact 320x240 and nearest-neighbor 1280x960 and ORA
        run: |
          python design/issue-16-direction-lot1/attaque_g01_v2.py design/issue-16-direction-lot1
      - name: Commit V2 visual design files on design branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add design/issue-16-direction-lot1/attaque_expression_320x240.png
          git add design/issue-16-direction-lot1/attaque_expression_x4.png
          git add design/issue-16-direction-lot1/attaque_expression_layers.ora
          if ! git diff --cached --quiet; then
            git commit -m 'design(g01): version native expressive ATTAQUE V2 and editable ORA'
            git push origin HEAD:design/issue-16-direction-lot1
          fi
