name: PAT-01 render source PO and publish exact exports
on:
  push:
    branches: [design/issue-79-patrouilleur-intact]
    paths:
      - .github/workflows/pat-01-render.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render-verify-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PAT-01 branch
        uses: actions/checkout@v4
        with:
          ref: design/issue-79-patrouilleur-intact
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned Pillow
        run: python -m pip install Pillow==12.3.0
      - name: Produce only the native and x4 reference PNGs
        run: python design/patrouilleur/export_patrouilleur.py
      - name: Independent readback and pixel-exact verification
        run: python design/patrouilleur/export_patrouilleur.py --check
      - name: Commit exports and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- design/patrouilleur/patrouilleur_intact_320x240.png design/patrouilleur/patrouilleur_intact_x4.png design/patrouilleur/preuves/export_manifest.json
          git rm -- .github/workflows/pat-01-render.yml
          git diff --cached --name-only
          test "$(git diff --cached --name-only | wc -l)" -eq 4
          git commit -m "design(PAT-01): publish source-faithful native/x4 PNGs and measured proofs (#79)"
          git push origin HEAD:design/issue-79-patrouilleur-intact
