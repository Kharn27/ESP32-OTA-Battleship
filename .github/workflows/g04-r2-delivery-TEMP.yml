name: G04-R2 delivery (TEMPORARY — removed after delivery)
on:
  push:
    branches: [design/g04-r2-attaque]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download hash-pinned G04-R2 source and previews
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --max-time 120 --output /tmp/g04r2_delivery.zip 'https://at.adobe.com/4JGmq1gswQraF2DY'
          echo '305bbc434fbb3c5e8e9a8cea96850c5cc32f22c18fca58d29f71f2e5cd7b18e6  /tmp/g04r2_delivery.zip' | sha256sum -c -
          unzip -q -o /tmp/g04r2_delivery.zip -d .
      - name: Check artwork artifacts and geometric contract (PC)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check Pillow
          python3 design/ecrans/attaque/verify_g04_r2.py
      - name: Commit complete G04-R2 deliverable
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add design/ecrans/attaque
          if ! git diff --cached --quiet; then
            git commit -m 'design(g04-r2): native maritime attack preview sources exports and PC proofs (Refs #45)'
            git push origin HEAD:design/g04-r2-attaque
          fi
