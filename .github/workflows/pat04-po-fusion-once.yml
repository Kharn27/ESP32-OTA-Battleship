name: PAT-04 PO fusion import (temporary)
on:
  push:
    branches:
      - design/issue-82-patrouilleur-detruit-fusion-po
    paths:
      - .github/workflows/pat04-po-fusion-once.yml
permissions:
  contents: write
jobs:
  import-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pixel-exact export dependency
        run: python -m pip install Pillow==12.3.0
      - name: Download uploaded PO master PNG and prove SHA-256
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 --retry-all-errors --output draft/patrouilleur_B_PO_fusion.png 'https://at.adobe.com/T0Vm45R34vMjTZbi'
          printf '%s  %s\n' 'e004d3b1274133f118ab407e7854d2050121654cca0881b513c7acbc3bd1a808' 'draft/patrouilleur_B_PO_fusion.png' | sha256sum --check --strict
          file draft/patrouilleur_B_PO_fusion.png
      - name: Replace original B JPEG and render full-frame static PAT-04
        run: |
          set -euo pipefail
          python design/patrouilleur/export_pat04_detruit.py
          python design/patrouilleur/export_pat04_detruit.py --check
      - name: Commit binary assets, export proofs, and remove this transient workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/pat04-po-fusion-once.yml
          git add draft/patrouilleur_B_PO_fusion.png draft/patrouilleur_B.jpeg
          git add design/patrouilleur/patrouilleur_detruit_320x240.png design/patrouilleur/patrouilleur_detruit_x4.png
          git add design/patrouilleur/preuves/pat04_export_manifest.json
          git diff --cached --stat
          git commit -m 'design(PAT-04): remplacer B par fusion PO et livrer preuves #82'
          git push origin HEAD:design/issue-82-patrouilleur-detruit-fusion-po
