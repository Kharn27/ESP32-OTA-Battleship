name: G04-R2 corrections PC proof (TEMP)
on:
  push:
    branches: [design/g04-r2-attaque]
    paths: [.github/workflows/g04-r2-proof-TEMP.yml]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract hash-pinned review delivery, regenerate and independently verify
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --max-time 120 -o /tmp/g04review.zip 'https://at.adobe.com/ptdovziMwVVYd4z8'
          echo '97acd2d3aa9cc520e590f0a55e2a86a631c365ffdb972d153a37239fcaeee496  /tmp/g04review.zip' | sha256sum -c -
          python3 - <<'PY'
          from zipfile import ZipFile
          from pathlib import PurePosixPath
          z=ZipFile('/tmp/g04review.zip')
          filelist=[i for i in z.namelist() if not i.endswith('/')]
          assert len(filelist)==10,filelist
          assert all(i.startswith('design/ecrans/attaque/') and '..' not in PurePosixPath(i).parts for i in filelist)
          z.extractall('.')
          print('PC proof archive: 10 scoped source/export files')
          PY
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-dejavu-core
          python3 -m pip install --disable-pip-version-check --quiet 'Pillow==12.3.0'
          python3 design/ecrans/attaque/build_g04_r2.py > /tmp/g04-build-report.txt
          python3 design/ecrans/attaque/verify_g04_r2.py | tee design/ecrans/attaque/verification-PC.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add design/ecrans/attaque
          git diff --cached --stat
          if ! git diff --cached --quiet; then
             git commit -m 'design(g04-r2): correct riposte, add 4 visual states and pixel-grid PC evidence (Refs #45)'
             git push origin HEAD:design/g04-r2-attaque
          fi
