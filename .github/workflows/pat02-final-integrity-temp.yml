name: PAT-02 T1A final integrity (temporary)
on:
  push:
    branches:
      - design/issue-80-patrouilleur-degats-arriere
permissions:
  contents: read
jobs:
  pat02:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned Pillow
        run: python -m pip install Pillow==12.3.0
      - name: Verify canonical source, PAT-01, T1A native, x4 pixel equality and manifest
        run: python design/patrouilleur/export_pat02_arriere.py --check
      - name: Verify no generation changes to working tree
        run: git diff --exit-code && test -z "$(git status --porcelain)"
