name: C99 host and ESP32 build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host:
    name: C99 ${{ matrix.cc }} (ASan UBSan)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source HEAD
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git rev-parse HEAD
      - name: Tool versions
        run: |
          ${{ matrix.cc }} --version | head -1
          cmake --version | head -1
          ninja --version
      - name: Install pinned G01 visual converter
        run: |
          python3 -m venv "$RUNNER_TEMP/d15a-py"
          "$RUNNER_TEMP/d15a-py/bin/python" -m pip install --disable-pip-version-check "Pillow==12.3.0"
          echo "$RUNNER_TEMP/d15a-py/bin" >> "$GITHUB_PATH"
      - name: Configure
        run: cmake -S tests -B build-host -G Ninja -DCMAKE_C_COMPILER=${{ matrix.cc }} -DWARSHIP_SANITIZERS=ON -DPython3_EXECUTABLE="$RUNNER_TEMP/d15a-py/bin/python"
      - name: Verify reproducible G03 conversion
        run: |
          python3 tools/t03_export.py --input maquettes/deploiement/legacy/g03_deploiement_320x240.png --output build-host/t03_second.c
          cmp build-host/t03_g03_data.c build-host/t03_second.c
      - name: Verify G01 native assets, reproducibility and 320x240 pixel differences
        run: |
          python3 scripts/check_graphic_pipeline.py
          python3 tools/d15a_generate_g01.py --repo . --output build-host/d15a_second.c --report build-host/d15a_g01_metrics.json --preview build-host/d15a_g01_firmware.png --reference maquettes/accueil/legacy/accueil_cyd_warship_320x240.png
          cmp build-host/d15a_g01_data.c build-host/d15a_second.c
          python3 - <<'PY'
          import json
          data=json.load(open("build-host/d15a_g01_metrics.json"))
          assert len(data["flash_layers"]) == 4
          assert data["flash_pixel_bytes"] == 208350
          assert data["source"].startswith("assets/manifest.json")
          for key in ("maquette_vs_assembled_rgb888","maquette_vs_firmware_rgb565",
                      "rgb888_source_vs_firmware_rgb565"):
              assert 0 <= data[key]["different_pixels"] <= 76800
          print("G01_RGBA_COMPARISON_PASS", json.dumps(data, sort_keys=True))
          PY
          test ! -d design
      - name: Build
        run: cmake --build build-host --verbose
      - name: Run tests
        run: ctest --test-dir build-host --output-on-failure -V
      - name: Check reproducible Portraits01 frozen exports and real alpha
        run: |
          python3 tools/portraits01_generate.py --repo . --output build-host/portraits01_second.c --report build-host/portraits01_second.json
          cmp build-host/portraits01_data.c build-host/portraits01_second.c
          python3 - <<'PY'
          import json
          r=json.load(open("build-host/portraits01_sources.json"))
          assert r["source_pr_head"] == "dab0a35a1a891ab4d215a55cd16f2fe095a558df"
          assert r["flash_bytes"] == 22272
          assert len(r["sprites"]) == 3
          print("PORTRAITS01_FROZEN_SOURCES_PASS", json.dumps(r,sort_keys=True))
          PY
      - name: G01 PC proof (not CYD validation)
        uses: actions/upload-artifact@v4
        with:
          name: d15a-G01-PC-${{ matrix.cc }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            build-host/d15a_g01_metrics.json
            build-host/d15a_g01_firmware.png
          if-no-files-found: error

      - name: Portraits01 PC comparison proof (not CYD validation)
        uses: actions/upload-artifact@v4
        with:
          name: portraits01-PC-${{ matrix.cc }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            build-host/portraits01_sources.json
            build-host/portraits01_pc_comparison.json
          if-no-files-found: error

  esp32:
    name: ESP-IDF v5.5.6 Xtensa esp32
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source HEAD
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git rev-parse HEAD
      - name: Verify unconditional D09 boot and retired mode selector
        run: |
          test ! -e main/Kconfig.projbuild
          test ! -e main/t02_probe.c
          test ! -e main/t02_probe.h
          test -f sdkconfig.defaults
          test "$(grep -Ec '^CONFIG_' sdkconfig.defaults)" -eq 1
          grep -Fxq 'CONFIG_ESP_MAIN_TASK_STACK_SIZE=4096' sdkconfig.defaults
          ! grep -Eq 'CONFIG_WARSHIP_BOOT_|CONFIG_WARSHIP_BOOT_' sdkconfig.defaults
          ! grep -R -q 'CONFIG_WARSHIP_BOOT_' main components
          grep -Fq 'd09_probe_run();' main/app_main.c
          grep -Fq '"d09_probe.c"' main/CMakeLists.txt
          grep -Fq "WARSHIP_D15A_G01_TEST_ONLY" CMakeLists.txt
          grep -Fq '"d15a_g01_preview.c"' main/CMakeLists.txt
          ! grep -Fq '"t02_probe.c"' main/CMakeLists.txt
      - name: Build and static memory report
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.6
          target: esp32
          command: >-
            idf.py --version &&
            xtensa-esp32-elf-gcc --version &&
            idf.py set-target esp32 &&
            idf.py build &&
            idf.py size &&
            idf.py size-components &&
            grep -Fx 'CONFIG_ESP_MAIN_TASK_STACK_SIZE=4096' sdkconfig &&
            sha256sum build/cyd_warship.bin &&
            ! strings build/cyd_warship.elf | grep -Fq 'D15A_G01_TEST_ONLY=ON' &&
            ! strings build/cyd_warship.elf | grep -Fq 'G01_ASSET_LAYERS' &&
            ! strings build/cyd_warship.elf | grep -Fq 'PORTRAITS01_TFT_TEST_ONLY=ON' &&
            test -s build/esp-idf/warship_solo/CMakeFiles/__idf_warship_solo.dir/warship_solo.c.su &&
            grep -F 'choose_public_target' build/esp-idf/warship_solo/CMakeFiles/__idf_warship_solo.dir/warship_solo.c.su &&
            grep -F 'commit_resolved_pair' build/esp-idf/warship_solo/CMakeFiles/__idf_warship_solo.dir/warship_solo.c.su &&
            grep -F 'warship_solo_fire' build/esp-idf/warship_solo/CMakeFiles/__idf_warship_solo.dir/warship_solo.c.su
      - name: Build explicitly isolated D11 diagnostic firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.6
          target: esp32
          command: >-
            idf.py -B build-d11-bench -D WARSHIP_D11_NVS_BENCH=ON set-target esp32 &&
            idf.py -B build-d11-bench -D WARSHIP_D11_NVS_BENCH=ON build &&
            grep -Fx 'CONFIG_ESP_MAIN_TASK_STACK_SIZE=4096' sdkconfig &&
            strings build-d11-bench/cyd_warship.elf | grep -Fq 'warship_d11lab' &&
            sha256sum build-d11-bench/cyd_warship.bin
      - name: D11 isolated bench firmware (NOT production palmares)
        uses: actions/upload-artifact@v4
        with:
          name: warship-d11-BENCH-isolated-NVS-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            build-d11-bench/cyd_warship.bin
            build-d11-bench/cyd_warship.elf
            build-d11-bench/bootloader/bootloader.bin
            build-d11-bench/partition_table/partition-table.bin
            build-d11-bench/flasher_args.json
            build-d11-bench/cyd_warship.map
            sdkconfig
          if-no-files-found: error
      - name: Build D13 isolated deterministic reception scenario
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.6
          target: esp32
          command: >-
            idf.py -B build-d13-reception
            -D WARSHIP_D11_NVS_BENCH=ON
            -D WARSHIP_D13_CYD_SCENARIO=ON set-target esp32 &&
            idf.py -B build-d13-reception
            -D WARSHIP_D11_NVS_BENCH=ON
            -D WARSHIP_D13_CYD_SCENARIO=ON build &&
            grep -Fx 'CONFIG_ESP_MAIN_TASK_STACK_SIZE=4096' sdkconfig &&
            strings build-d13-reception/cyd_warship.elf |
              grep -Fq 'D13_SCENARIO=ARMED' &&
            strings build-d13-reception/cyd_warship.elf |
              grep -Fq 'warship_d11lab' &&
            sha256sum build-d13-reception/cyd_warship.bin
      - name: D13 CYD reception TEST ONLY firmware (isolated NVS)
        uses: actions/upload-artifact@v4
        with:
          name: warship-d13-RECEPTION-TEST-ONLY-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            build-d13-reception/cyd_warship.bin
            build-d13-reception/cyd_warship.elf
            build-d13-reception/bootloader/bootloader.bin
            build-d13-reception/partition_table/partition-table.bin
            build-d13-reception/flasher_args.json
            build-d13-reception/cyd_warship.map
            sdkconfig
          if-no-files-found: error
      - name: Build T03 isolated Flash/G03 diagnostic (never production)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.6
          target: esp32
          command: >-
            idf.py -B build-t03 -D WARSHIP_T03_DIAGNOSTIC=ON set-target esp32 &&
            idf.py -B build-t03 -D WARSHIP_T03_DIAGNOSTIC=ON build &&
            idf.py -B build-t03 size &&
            idf.py -B build-t03 size-components &&
            sha256sum build-t03/cyd_warship.bin &&
            strings build-t03/cyd_warship.elf | grep -Fq 'T03_DIAGNOSTIC=ON'
      - name: T03 diagnostic BIN (test-only; NOT for normal CYD)
        uses: actions/upload-artifact@v4
        with:
          name: warship-t03-G03-TEST-ONLY-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            build-t03/cyd_warship.bin
            build-t03/cyd_warship.elf
            build-t03/bootloader/bootloader.bin
            build-t03/partition_table/partition-table.bin
            build-t03/flasher_args.json
            build-t03/cyd_warship.map
          if-no-files-found: error
      - name: Build D15-A isolated four-asset G01 preview TEST ONLY
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.6
          target: esp32
          command: >-
            python -m pip install --disable-pip-version-check 'Pillow==12.3.0' &&
            idf.py -B build-d15a-g01 -D WARSHIP_D15A_G01_TEST_ONLY=ON set-target esp32 &&
            idf.py -B build-d15a-g01 -D WARSHIP_D15A_G01_TEST_ONLY=ON build &&
            idf.py -B build-d15a-g01 size &&
            idf.py -B build-d15a-g01 size-components &&
            grep -Fx 'CONFIG_ESP_MAIN_TASK_STACK_SIZE=4096' sdkconfig &&
            strings build-d15a-g01/cyd_warship.elf | grep -Fq 'D15A_G01_TEST_ONLY=ON' &&
            ! strings build-d15a-g01/cyd_warship.elf | grep -Fq 'BLOCAGE_ASSETS_G03' &&
            sha256sum build-d15a-g01/cyd_warship.bin
      - name: D15-A G01 visual preview BIN (TEST ONLY; NO NVS)
        uses: actions/upload-artifact@v4
        with:
          name: d15a-G01-TEST-ONLY-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            build-d15a-g01/cyd_warship.bin
            build-d15a-g01/cyd_warship.elf
            build-d15a-g01/bootloader/bootloader.bin
            build-d15a-g01/partition_table/partition-table.bin
            build-d15a-g01/flasher_args.json
            build-d15a-g01/cyd_warship.map
            sdkconfig
          if-no-files-found: error
      - name: Build GUI-01 isolated tactile button TEST ONLY
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.6
          target: esp32
          command: >-
            python -m pip install --disable-pip-version-check 'Pillow==12.3.0' &&
            idf.py -B build-gui01 -D WARSHIP_GUI01_TEST_ONLY=ON set-target esp32 &&
            idf.py -B build-gui01 -D WARSHIP_GUI01_TEST_ONLY=ON build &&
            idf.py -B build-gui01 size &&
            idf.py -B build-gui01 size-components &&
            strings build-gui01/cyd_warship.elf | grep -Fq 'WARSHIP_GUI01_TEST_ONLY=ON' &&
            strings build-gui01/cyd_warship.elf | grep -Fq 'GUI01_ACTIVATE' &&
            ! strings build-gui01/cyd_warship.elf | grep -Fq 'D15A_G01_TEST_ONLY=ON' &&
            ! strings build-gui01/cyd_warship.elf | grep -Fq 'warship_d11lab' &&
            sha256sum build-gui01/cyd_warship.bin
      - name: GUI-01 tactile button BIN (TEST ONLY, NO GAME/NVS)
        uses: actions/upload-artifact@v4
        with:
          name: gui01-TEST-ONLY-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            build-gui01/cyd_warship.bin
            build-gui01/cyd_warship.elf
            build-gui01/bootloader/bootloader.bin
            build-gui01/partition_table/partition-table.bin
            build-gui01/flasher_args.json
            build-gui01/cyd_warship.map
            sdkconfig
          if-no-files-found: error
      - name: Build Portraits01 native CYD isolated TEST-ONLY
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.6
          target: esp32
          command: >-
            python -m pip install --disable-pip-version-check 'Pillow==12.3.0' &&
            idf.py -B build-portraits01 -D WARSHIP_PORTRAITS01_TEST_ONLY=ON set-target esp32 &&
            idf.py -B build-portraits01 -D WARSHIP_PORTRAITS01_TEST_ONLY=ON build &&
            idf.py -B build-portraits01 size &&
            idf.py -B build-portraits01 size-components &&
            strings build-portraits01/cyd_warship.elf | grep -Fq 'PORTRAITS01_TFT_TEST_ONLY=ON' &&
            ! strings build-portraits01/cyd_warship.elf | grep -Fq 'warship_d11lab' &&
            ! strings build-portraits01/cyd_warship.elf | grep -Fq 'GUI01_ACTIVATE' &&
            sha256sum build-portraits01/cyd_warship.bin
      - name: Portraits01 CYD TEST-ONLY BIN (no hardware validation)
        uses: actions/upload-artifact@v4
        with:
          name: portraits01-TEST-ONLY-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            build-portraits01/cyd_warship.bin
            build-portraits01/cyd_warship.elf
            build-portraits01/bootloader/bootloader.bin
            build-portraits01/partition_table/partition-table.bin
            build-portraits01/flasher_args.json
            build-portraits01/cyd_warship.map
            build-portraits01/esp-idf/portraits01/portraits01_sources.json
            sdkconfig
          if-no-files-found: error
      - name: Firmware artifact (no device validation)
        uses: actions/upload-artifact@v4
        with:
          name: warship-esp32-firmware-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            build/cyd_warship.bin
            build/cyd_warship.elf
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/flasher_args.json
            build/cyd_warship.map
            build/esp-idf/warship_solo/CMakeFiles/__idf_warship_solo.dir/warship_solo.c.su
            sdkconfig
            dependencies.lock
          if-no-files-found: error
