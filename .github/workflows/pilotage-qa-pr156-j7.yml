                      assert im.mode=="RGBA" and im.size==(n,n)
                      a=im.tobytes()[3::4]
                      assert a.count(0)==ent["alpha_0"] and a.count(255)==ent["alpha_255"]
                      assert sum(0<x<255 for x in a)==ent["alpha_partial"]
                      bb=im.getbbox()
                      assert [bb[0],bb[1],bb[2]-1,bb[3]-1]==ent["bbox_nonzero"]
                      with Image.open(ex/"preuves"/f"jalon6_{name}_{n}_x4.png") as z:
                          assert z.mode=="RGBA" and z.size==(n*4,n*4)
                          assert z.tobytes()==im.resize((n*4,n*4),Image.Resampling.NEAREST).tobytes()
                      if n in (48,64):
                          alive={(x,y) for y in range(n) for x in range(n) if a[y*n+x]>=6}
                          groups=0
                          while alive:
                              groups+=1
                              stack=[alive.pop()]
                              while stack:
                                  x,y=stack.pop()
                                  for neighbor in ((x-1,y),(x+1,y),(x,y-1),(x,y+1)):
                                      if neighbor in alive:
                                          alive.remove(neighbor);stack.append(neighbor)
                          assert groups==1,(name,groups)
          proofs=list((ex/"preuves").glob("jalon6_*.png"))
          assert len(proofs)==len(j["proofs"])==21
          assert {str(p) for p in proofs}=={e["path"] for e in j["proofs"]}
          files.extend((e,None) for e in j["proofs"])
          assert len(files)==45
          seen=set()
          for e,n in files:
              path=Path(e["path"]);assert str(path) not in seen;seen.add(str(path))
              assert re.fullmatch("[0-9a-f]{64}",e["sha256"])
              buf=path.read_bytes()
              assert len(buf)==e["size_bytes"] and hashlib.sha256(buf).hexdigest()==e["sha256"],path
              with Image.open(path) as im:
                  assert im.mode=="RGBA" and im.format=="PNG"
                  if n:assert im.size==(n,n)
          for page in (1,2):
              for theme in ("clair","sombre"):
                  with Image.open(ex/"preuves"/f"jalon6_p{page}_320x240_{theme}.png") as im:
                      assert im.size==(320,240) and im.mode=="RGBA"
          with Image.open(ex/"preuves"/"jalon6_contact_1120x182.png") as im:
              assert im.size==(1120,182) and im.mode=="RGBA"
          print("J6_INDEPENDENT_PASS: 45 SHA+size, 5 sources, 8 exact crops, 1 mask, 16 zooms, 16 components, 4 native, contact")
          PY
      - name: J7 independent 68 IDs, 91 SHA+size, crops, masks, RGBA, 30 zooms and components
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,re
          from pathlib import Path
          from PIL import Image
          root=Path("draft/portraits");ex=root/"exports"
          manifests=[json.loads((ex/f"manifest_jalon{i}.json").read_text()) for i in range(8)]
          j=manifests[7]
          expected={"D-L2-C5",*[f"D-L3-C{k}" for k in range(1,6)],*[f"D-L4-C{k}" for k in range(1,6)],"E-L2-C3","E-L4-C1","E-L4-C2","E-L4-C3"}
          ids=[r["id"] for r in j["items"]]
          assert len(ids)==15 and len(set(ids))==15 and set(ids)==expected
          prior={manifests[0]["pilot"]["id"]}
          for i in range(7):
              new=[r["id"] for r in manifests[i]["items"]]
              assert len(new)==len(set(new)) and not prior.intersection(new),i
              prior.update(new)
          assert len(prior)==53 and not prior.intersection(expected)
          complete=prior|expected
          assert len(complete)==68
          assert {s:sum(p.startswith(s+"-") for p in complete) for s in "ABCDE"}==dict(A=8,B=8,C=16,D=20,E=16)
          assert j["status"]=="CANDIDATE" and j["device_status"]=="ON_DEVICE_UNVERIFIED"
          for letter,h in j["source_reference_sha256"].items():
              p=root/f"portrait_{letter}.png"
              assert hashlib.sha256(p.read_bytes()).hexdigest()==h,p
              print("ORIGINAL_PO_SHA_OK",letter)
          records=[]
          for row in j["items"]:
              name=row["id"];side=row["master_square"];x0,y0,x1,y1=row["rect"];top=row["transparent_pad_top"]
              assert x1-x0==side and y1-y0+top<=side,name
              with Image.open(root/f"portrait_{row['sheet']}.png") as original:
                  assert original.mode=="RGBA"
                  crop=original.crop((x0,y0,x1,y1))
              base=Image.new("RGBA",(side,side),(0,0,0,0));base.paste(crop,(0,top))
              old=bytearray(base.tobytes())
              for i in range(0,len(old),4):
                  if old[i+3]==0:old[i:i+3]=b"\0\0\0"
              removed_total=0
              for mask in row["local_masks"]:
                  assert mask["policy"]=="all"
                  a,b,c,d=mask["rect"]
                  assert 0<=a<c<=side and 0<=b<d<=side
                  removed=0
                  for y in range(b,d):
                      for x in range(a,c):
                          k=(y*side+x)*4
                          removed+=bool(old[k+3])
                          old[k:k+4]=b"\0\0\0\0"
                  assert removed==mask["removed_alpha_nonzero"],name
                  removed_total+=removed
              assert removed_total==row["mask_removed_alpha_nonzero"]
              assert row["mask_outside_changed_channels"]==0
              master=row["files"]["master"]
              with Image.open(master["path"]) as img:
                  assert img.mode=="RGBA" and img.size==(side,side)
                  assert img.tobytes()==bytes(old),("master source/mask mismatch",name)
              records.append((master,(side,side)))
              for key,n in (("p48",48),("p64",64)):
                  f=row["files"][key]
                  with Image.open(f["path"]) as img:
                      assert img.mode=="RGBA" and img.size==(n,n)
                      raw=img.tobytes();alpha=raw[3::4]
                      assert alpha.count(0)==f["alpha_0"] and alpha.count(255)==f["alpha_255"]
                      assert sum(0<a<255 for a in alpha)==f["alpha_partial"]
                      bb=img.getbbox()
                      assert [bb[0],bb[1],bb[2]-1,bb[3]-1]==f["bbox_nonzero"],name
                      assert all(raw[k:k+3]==b"\0\0\0" for k in range(0,len(raw),4) if raw[k+3]==0),name
                      with Image.open(ex/"preuves"/f"jalon7_{name}_{n}_x4.png") as zoom:
                          assert zoom.mode=="RGBA" and zoom.size==(n*4,n*4)
                          assert zoom.tobytes()==img.resize((n*4,n*4),Image.Resampling.NEAREST).tobytes(),name
                      remaining={(x,y) for y in range(n) for x in range(n) if alpha[y*n+x]>=6}
                      groups=0
                      while remaining:
                          groups+=1;stack=[remaining.pop()]
                          while stack:
                              x,y=stack.pop()
                              for nbr in ((x-1,y),(x+1,y),(x,y-1),(x,y+1)):
                                  if nbr in remaining:remaining.remove(nbr);stack.append(nbr)
                      assert groups==1,(name,n,groups)
                  records.append((f,(n,n)))
              print("J7_MASKS_AND_SPRITES_PASS",name,removed_total)
          proofs=list((ex/"preuves").glob("jalon7_*.png"))
          assert len(proofs)==len(j["proofs"])==46
          assert {str(x) for x in proofs}=={x["path"] for x in j["proofs"]}
          for r in j["proofs"]:
              name=Path(r["path"]).name
              mo=re.search(r"_(48|64)_x4\.png$",name)
              wh=(int(mo.group(1))*4,)*2 if mo else (1120,182) if "contact_" in name else (320,240)
              records.append((r,wh))
          assert len(records)==91
          seen=set()
          for entry,wh in records:
              p=Path(entry["path"])
              assert str(p) not in seen;seen.add(str(p))
              assert re.fullmatch("[0-9a-f]{64}",entry["sha256"])
              b=p.read_bytes()
              assert len(b)==entry["size_bytes"] and hashlib.sha256(b).hexdigest()==entry["sha256"],p
              with Image.open(p) as img:
                  assert img.format=="PNG" and img.mode=="RGBA" and img.size==wh,(p,img.mode,img.size,wh)
                  img.verify()
          print("J7_INDEPENDENT_PASS: 68 unique IDs, 5 immutable PO originals, 91 SHA/size/RGBA/dimensions, 15 exact masters, 7 mask ROIs, 30 zooms nearest and 30 connected-components")
          PY
      - name: J3 connector helper JS codec smoke check
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          node - <<'JS'
          const fs=require("fs"),crypto=require("crypto");
          const code=fs.readFileSync("draft/portraits/exports/connector_jalon3.js","utf8");
          const api=new Function(code)();
          if(!api || !api.decodePng || !api.pngRGBA || !api.boxAlpha || !api.sha256)throw Error("JS helper invalid");
          if(api.sha256(new TextEncoder().encode("abc"))!=="ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad")throw Error("JS SHA-256 invalid");
          const base="draft/portraits/exports/A-L1-C4";
          const expected=new Uint8Array(fs.readFileSync(base+"/portrait_48.png"));
          const decoded=api.decodePng(expected);
          if(decoded.w!==48 || decoded.h!==48)throw Error("JS PNG decoding dimensions");
          const bytes=api.pngRGBA(48,48,decoded.pixels);
          if(!Buffer.from(bytes).equals(Buffer.from(expected)))throw Error("JS PNG codec does not reproduce expected bytes");
          const master=api.decodePng(new Uint8Array(fs.readFileSync(base+"/master_HD.png")));
          const generated=api.boxAlpha(master.pixels,master.w,48);
          if(!Buffer.from(generated).equals(Buffer.from(decoded.pixels)))throw Error("JS and Python BOX disagreement");
          if(api.sha256(expected)!==crypto.createHash("sha256").update(expected).digest("hex"))throw Error("JS SHA mismatch");
          console.log("J3_JS_HELPER_OK: PNG roundtrip, BOX pixel identity, SHA");
          JS
