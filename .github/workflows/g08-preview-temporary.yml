name: G08 temporary visual exports
on:
  push:
    branches: [design/issue-55-g08-inspection]
    paths:
      - 'design/issue-55-g08-inspection/build_g08.py'
      - '.github/workflows/g08-preview-temporary.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render-and-prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare host graphics dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "cairosvg>=2.7,<3" "pillow>=11,<13"
      - name: Produce G08 source exports and enforce structural and NEAREST checks
        run: |
          python design/issue-55-g08-inspection/build_g08.py | tee /tmp/g08-proof.log
          test -s design/issue-55-g08-inspection/g08_inspection_320x240.png
          test -s design/issue-55-g08-inspection/g08_variantes_x4.png
          cat design/issue-55-g08-inspection/generation-report.txt
      - name: Commit generated PNG and SVG exports on the G08 branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add design/issue-55-g08-inspection/
          if ! git diff --cached --quiet; then
            git commit -m "design(G08): generated 320x240 SVG/PNG evidence from validated source"
            git push
          fi
