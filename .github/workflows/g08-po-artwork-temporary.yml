name: G08 PO artwork — one-shot publish and validation
on:
  push:
    branches:
      - design/issue-55-g08-inspection
    paths:
      - .github/workflows/g08-po-artwork-temporary.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout G08
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Fetch checked PO design package
        env:
          DELIVERY_URL: https://at.adobe.com/mkYZJPhXrFwtNV4i
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 --max-time 120 "$DELIVERY_URL" -o /tmp/g08-delivery.zip
          file /tmp/g08-delivery.zip
          unzip -t /tmp/g08-delivery.zip
          rm -f design/issue-55-g08-inspection/*.svg design/issue-55-g08-inspection/build_g08.py
          unzip -o /tmp/g08-delivery.zip -d .
      - name: Rebuild and prove native PNGs + editable ORA
        run: |
          set -euo pipefail
          python3 -m pip install --user pillow
          python3 design/issue-55-g08-inspection/build_g08_reference.py
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          import json,zipfile
          p=Path('design/issue-55-g08-inspection')
          j=json.loads((p/'scenario_G08.json').read_text())
          assert sorted(map(len,j['fleet'].values()))==[2,3,3,4,5]
          assert len(j['hits'])==12 and len(j['untouched'])==5
          assert set(j['hits']).isdisjoint(j['misses'])
          for state in 'abc':
              native=Image.open(p/f'g08_etat_{state}_320x240.png')
              zoom=Image.open(p/f'g08_etat_{state}_x4.png')
              assert native.size==(320,240) and zoom.size==(1280,960)
              assert native.resize(zoom.size,Image.Resampling.NEAREST).tobytes()==zoom.tobytes()
              with zipfile.ZipFile(p/f'g08_etat_{state}_layers.ora') as z:
                  assert z.testzip() is None
                  assert all(f'data/layer{i}.png' in z.namelist() for i in range(3))
          print('PASS: 3 native PNG, 3 NEAREST x4, 3 layered sources, 5 ships / 17 cells, 12 hits')
          PY
      - name: Commit artworks on Draft PR branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A design/issue-55-g08-inspection
          if ! git diff --cached --quiet; then
            git commit -m "design(G08): rebuild all states from PO maritime reference (Refs #55)"
            git push
          fi
