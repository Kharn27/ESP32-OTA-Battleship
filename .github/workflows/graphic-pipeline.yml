name: Graphic pipeline structure

on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'design/**'
      - 'design/**'
      - 'assets/**'
      - 'maquettes/**'
      - 'docs/GRAPHIC_PIPELINE.md'
      - 'scripts/check_graphic_pipeline.py'
      - '.github/workflows/graphic-pipeline.yml'
  push:
    branches: [main]
    paths:
      - 'AGENTS.md'
      - 'assets/**'
      - 'maquettes/**'
      - 'docs/GRAPHIC_PIPELINE.md'
      - 'scripts/check_graphic_pipeline.py'
      - '.github/workflows/graphic-pipeline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-graphic-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
      - name: Validate approved assets and screen references
        run: python3 scripts/check_graphic_pipeline.py
