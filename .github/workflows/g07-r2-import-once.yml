# TEMPORARY one-shot transport for reviewed user PNG; self-removes after success.
name: G07-R2 one-shot corrected native raster import
on:
  push:
    branches:
      - design/g07-r2-verdict
permissions:
  contents: write
jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/g07-r2-verdict
          persist-credentials: true
      - name: Install preview verifier dependencies
        run: python3 -m pip install 'Pillow>=10,<14' 'numpy>=1.24,<3'
      - name: Transfer exact 320x240 user-supplied source
        shell: bash
        env:
          SOURCE_URL: https://at.adobe.com/nKzrgbKBxyVls1MI
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --max-time 120 --silent --show-error "$SOURCE_URL" --output design/ecrans/fin-partie/g07_r2_source_320x240.png
          echo "81bd1bcfc6e04316a9b34c90a97727f3598ec7ebf1951a0444043e17f3a5da8d  design/ecrans/fin-partie/g07_r2_source_320x240.png" | sha256sum --check
      - name: Generate and validate native and nearest zoom
        run: python3 design/ecrans/fin-partie/build_g07_r2.py
      - name: Commit exports and drop temporary workflow + obsolete source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm --ignore-unmatch -f .github/workflows/g07-r2-import-once.yml
          git rm --ignore-unmatch -f design/ecrans/fin-partie/g07_r2_source_1448x1086.png
          git add design/ecrans/fin-partie/g07_r2_source_320x240.png \
                  design/ecrans/fin-partie/g07_r2_defaite_320x240.png \
                  design/ecrans/fin-partie/g07_r2_defaite_x4.png \
                  design/ecrans/fin-partie/g07_r2_geometry_proof_x4.png \
                  design/ecrans/fin-partie/g07_r2_provenance.json
          git diff --cached --stat
          git commit -m 'design(G07-R2): deliver exactly measured 320x240 grid and x4 (Refs #53)'
          git push origin HEAD:design/g07-r2-verdict
