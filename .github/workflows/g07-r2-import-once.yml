# Temporary import helper; must be deleted from the Draft branch after upload.
name: G07-R2 one-shot raster import
on:
  push:
    branches:
      - design/g07-r2-verdict
permissions:
  contents: write
jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/g07-r2-verdict
          persist-credentials: true
      - name: Pillow for review exports
        run: python3 -m pip install 'Pillow>=10,<14'
      - name: Copy original illustration from Adobe temporary handoff URL
        shell: bash
        env:
          SOURCE_URL: https://at.adobe.com/Gy8Z1DkD3ifquLcN
        run: |
          curl --fail --location --retry 3 --max-time 120 --silent --show-error "$SOURCE_URL" \
            --output design/ecrans/fin-partie/g07_r2_source_1448x1086.png
      - name: Produce PNG and verify pixel-exact nearest zoom
        run: python3 design/ecrans/fin-partie/build_g07_r2.py
      - name: Commit all three raster exports and hash evidence
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add design/ecrans/fin-partie/g07_r2_source_1448x1086.png \
                  design/ecrans/fin-partie/g07_r2_defaite_320x240.png \
                  design/ecrans/fin-partie/g07_r2_defaite_x4.png \
                  design/ecrans/fin-partie/g07_r2_provenance.json
          git commit -m 'design(G07-R2): deliver flattened source and PC exports (Refs #53)'
          git push origin HEAD:design/g07-r2-verdict
