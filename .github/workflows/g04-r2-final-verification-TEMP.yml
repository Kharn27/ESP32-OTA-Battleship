name: G04-R2 one-shot native art verification (remove before merge)
on:
  push:
    branches:
      - design/g04-r2-attaque
  workflow_dispatch:
jobs:
  native-art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deterministic raster dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-dejavu-core
          python3 -m pip install --user Pillow==12.3.0
      - name: Regenerate approved reference and verify final native PNG
        run: |
          set -euxo pipefail
          python3 design/ecrans/attaque/build_g04_r2.py
          python3 design/ecrans/attaque/verify_g04_r2.py
          git diff --exit-code -- design/ecrans/attaque/g04_r2_attaque_320x240.png design/ecrans/attaque/g04_r2_attaque_x4.png design/ecrans/attaque/g04_r2_etats_320x240.png design/ecrans/attaque/g04_r2_etats_x4.png design/ecrans/attaque/generation-report.json
          test "$(find design/ecrans/attaque -maxdepth 1 -type f \( -name '*avant*' -o -name '*comparaison*' -o -name '*mer_continue*' -o -name '*plateau_sans_impacts*' \) | wc -l)" -eq 0
