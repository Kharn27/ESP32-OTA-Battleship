    <path d="M17 7V8M43 8V9M12 11V12M45 11V12" fill="none" stroke="#1D3A48" stroke-width="1"/>
    <path d="M19 14H23M36 14H39" stroke="#A87558" stroke-width="1" fill="none"/>
    <path d="M47 9H50V10H47Z" fill="#BBC8BC"/>
    <path d="M49 11H51" stroke="#647F86" stroke-width="1"/>
