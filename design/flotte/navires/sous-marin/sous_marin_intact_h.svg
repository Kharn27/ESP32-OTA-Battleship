    <path d="M26 2V5M29 1V5M32 3V5" fill="none" stroke="#0A1C32" stroke-width="2"/>
    <path d="M26 2V4M29 1V4M32 3V4" fill="none" stroke="#C1C8BC" stroke-width="1"/>
    <path d="M29 1H31V2H30Z" fill="#E8D6A5"/>
    <path d="M32 3H33V4H32Z" fill="#F0B975"/>
