<svg xmlns="http://www.w3.org/2000/svg" width="54" height="18" viewBox="0 0 54 18" shape-rendering="crispEdges">
  <title>FLOT-01 sous-marin intact horizontal, concept PO, 3 cases</title>
  <desc>Vue de dessus en pixel art, silhouette fuselée à kiosque et mâts, sans mer et avec alpha.</desc>
  <g id="sous-marin-intact">
    <!-- Gouvernes de poupe triangulaires, distinctes de la proue arrondie -->
    <path d="M8 6L5 3H3V7L1 9V12L3 13V16H5L9 13Z" fill="#0A1C32"/>
    <path d="M7 7L5 5H4V8L2 9V11L4 12V14H5L8 12Z" fill="#657C7C"/>
    <path d="M4 8H10V11H4Z" fill="#314E60"/>
    <path d="M4 7H7V8H4Z" fill="#B7BDB0"/>
    <!-- Coque en plan : silhouette intégralement dans le gabarit 54x18 -->
    <path d="M5 8L9 6L16 5H39L46 6L50 8L53 9V11L50 13L46 14L39 15H16L9 14L5 12Z" fill="#0A1C32"/>
    <path d="M7 8L10 7L17 6H40L47 7L51 9V11L47 13L40 14H17L10 13L7 11Z" fill="#495B5F"/>
    <!-- Flanc sombre qui assoit le navire sur l'eau -->
    <path d="M8 11L12 12L20 13H41L47 12L50 11L47 13L40 14H17L10 13Z" fill="#263945"/>
    <path d="M11 8L17 7H41L47 8L49 9H43L39 8H18L12 9Z" fill="#8B9E9F"/>
