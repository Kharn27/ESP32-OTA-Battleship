    <path d="M13 9H22V11H13ZM35 9H43V11H35Z" fill="#647F86"/>
    <path d="M14 8H21V9H14ZM36 8H43V9H36Z" fill="#B4BDB3"/>
    <path d="M13 12H21V13H13ZM36 12H43V13H36Z" fill="#40545A"/>
    <path d="M18 7V8M20 11V13M35 7V8M40 11V13" fill="none" stroke="#0A1C32" stroke-width="1"/>
    <path d="M16 10H19M38 10H41" fill="none" stroke="#D7D2B8" stroke-width="1"/>
    <!-- Kiosque : encrage franc et plateau éclairé (G02 + PO). -->
    <path d="M22 7L24 4H32L35 7V12L32 13H24L21 11V8Z" fill="#0A1C32"/>
    <path d="M23 7L25 5H31L33 7V11L31 12H25L23 10Z" fill="#647A79"/>
    <path d="M25 5H31V7H25Z" fill="#ABB8AD"/>
    <path d="M24 8H32V10H24Z" fill="#485E63"/>
    <path d="M26 9H30V10H26Z" fill="#142F3E"/>
    <path d="M24 11H32V12H24Z" fill="#263945"/>
